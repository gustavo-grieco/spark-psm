# Symbolic verification of PSM3's stateless conversion properties with echidna,
# using the arithmetic-abstraction hevm (argotorg/hevm#1073). The abstraction is
# forced on inside echidna's verification path, so the mul/div lemmas apply.
#
# Run (needs the abstraction-enabled echidna on PATH + bitwuzla):
#   echidna test/symbolic/ProveRealPSM3.t.sol --contract ProveRealPSM3 \
#           --config test/symbolic/echidna.yaml
#
# Each prove_ verifies against the REAL deployed PSM3 (single-slot mock balances).
# Non-target / forge-std helper methods are skipped (shown as vacuously "passing").
testMode: verification
symExecSMTSolver: bitwuzla
workers: 0
seqLen: 1
disableSlither: true # https://github.com/crytic/slither/issues/2770

# Deep enough for the deployment + setUp + conversion path (default 10 is too low).
symExecMaxExplore: 5000
symExecMaxIters: 5000
symExecTimeout: 300

# Proper list of targets: the stateless conversion properties to verify.
symExecTargets:
  - prove_convertToShares_totalValue_eq_totalShares
  - prove_convertToAssetValue_totalShares_eq_totalAssets
  - prove_totalAssets_rateIncrease_valueChange
  - prove_totalAssets_exact
  - prove_assetValue_monotonic
  - prove_shares_monotonic
  - prove_shares_no_inflation
  - prove_roundtrip_no_inflation
  - prove_roundtrip_shares
  - prove_convertToAssets_usdc_monotonic
  - prove_convertToAssets_susds_monotonic
  - prove_convertToAssets_usds_eq_value
  - prove_assetValue_backing_monotonic
  - prove_shares_anti_monotonic_assets
  - prove_pd_usds_firstdeposit_mono
  - prove_pd_usdc_firstdeposit_mono
  - prove_pd_susds_firstdeposit_mono
